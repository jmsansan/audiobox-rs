name: Rust

on:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'src/**', 'tests/**', 'examples/*.rs', 'README.md', '.github/workflows/ci.yml']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --offline --all-targets -- -D warnings
      - run: cargo clippy --locked --offline --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --offline --all-targets --features synth -- -D warnings
      - run: cargo clippy --locked --offline --all-targets --features mixer -- -D warnings
      - run: cargo clippy --locked --offline --all-targets --features music -- -D warnings
      - run: cargo clippy --locked --offline --all-targets --features events -- -D warnings
      - run: cargo clippy --locked --offline --all-targets --features file-stream -- -D warnings
      - run: cargo test --locked --offline
        env:
          AUDIOBOX_MP3_CONTRACT_REPORT: target/mp3-contract/default-debug.csv
      - run: cargo test --locked --offline --all-features
        env:
          AUDIOBOX_MP3_CONTRACT_REPORT: target/mp3-contract/all-features-debug.csv
      - run: cargo test --locked --offline --release --all-features
        env:
          AUDIOBOX_MP3_CONTRACT_REPORT: target/mp3-contract/all-features-release.csv
      - run: cargo doc --locked --offline --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --locked --offline
      - run: rustc -Vv > target/mp3-contract/compiler.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mp3-contract-${{ matrix.os }}
          path: target/mp3-contract/

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo test --locked --offline --all-features
        env:
          AUDIOBOX_MP3_CONTRACT_REPORT: target/mp3-contract/msrv-debug.csv
      - run: rustc -Vv > target/mp3-contract/compiler.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mp3-contract-msrv
          path: target/mp3-contract/

  webassembly:
    # The checksum tests of deterministic rendering, run as WebAssembly under Node's WASI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo test --locked --offline --release --target wasm32-wasip1 --all-features --test deterministic --test delivery --test measurements --test true_peak --test normalization --test mp3_contract --test mp3_gapless --test virtual_voices --test ogg --test opus --test ogg_alloc --test dither --test synth --test prepared_synth --test synth_controls --test sfx --test assets --test music --test metadata --test effects --test routing --test colour_effects --test drums --test chip --test spatial --test events --test synthwave
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node --no-warnings scripts/wasi-run.mjs
          AUDIOBOX_MP3_CONTRACT_REPORT: ${{ github.workspace }}/target/mp3-contract/wasi-release.csv
      - run: rustc -Vv > target/mp3-contract/compiler.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mp3-contract-wasi
          path: target/mp3-contract/

  interoperability:
    # Keep FFmpeg installation out of the normal push/PR path.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo test --locked --offline --test interop
        env:
          AUDIOBOX_FFMPEG_TESTS: '1'
